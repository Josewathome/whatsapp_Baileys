version: '3.8'

services:
  baileys-bridge:
    build:
      context: .
      dockerfile: Dockerfile.prod.baileys
    container_name: baileys-service
    ports:
      - "3000:3000"  # Container port 3000 mapped to host 3000
    networks:
      - whatsapp-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  main-whatsapp-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: main-whatsapp-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - whatsapp-network
    restart: always
    depends_on:
      baileys-bridge:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  whatsapp-network:
    driver: bridge
